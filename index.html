function initials(n){ const w = String(n || 'M').trim().split(/\s+/).filter(Boolean); return ((w[0] || 'M')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }
function listFr(a){ if (!a.length) return ''; if (a.length === 1) return a[0]; return a.slice(0, -1).join(', ') + ' et ' + a[a.length - 1]; }
function adn(p){
  const name = p.identity.name || 'Ta marque';
  const tr = p.identity.personality.map(x => x.toLowerCase());
  const en = p.colors.energies.map(e => ENERGIES.find(x => x.id === e)?.label.toLowerCase()).filter(Boolean);
  const moods = p.mood.moods.map(m => MOODS.find(x => x.id === m)?.label.toLowerCase()).filter(Boolean);
  const imgs = p.visual.images.map(i => VISUALS.images.items.find(x => x.id === i)?.label.toLowerCase()).filter(Boolean);
  const pair = Engine.pair(p);
  let s = `${name} est une marque ${listFr(tr.length ? tr : en) || 'qui te ressemble'}`;
  if (moods.length) s += `, à l’univers ${listFr(moods)}`;
  s += '.';
  if (en.length) s += ` Ses couleurs dégagent une énergie ${listFr(en)}.`;
  if (pair) s += ` Sa typographie, style ${pair.label.toLowerCase()}, donne le ton${Engine.upper(p) ? ' en majuscules' : ''}.`;
  if (imgs.length) s += ` Elle s’exprime en ${listFr(imgs)}.`;
  if (p.mood.avoid.length) s += ` Elle évite tout ce qui est ${listFr(p.mood.avoid.map(a => a.replace(/^Trop /, 'trop ').toLowerCase()))}.`;
  return s;
}
function monogram(p, t, size, bg, fg){
  const sh = p.visual.shapes[0];
  const r = sh === 'geometriques' || sh === 'brutes' ? '0' : sh === 'organiques' ? '42% 58% 55% 45% / 50% 45% 55% 50%' : sh === 'lignes' ? '22%' : '50%';
  const b = bg || t.c.principale, f = fg || onColor(b);
  return `<span class="mono" style="width:${size}px;height:${size}px;border-radius:${r};background:${b};color:${f};font-family:${t.fd};font-weight:${t.pair.w};font-size:${Math.round(size * .4)}px">${esc(initials(p.identity.name))}</span>`;
}

  </div>`;

Screens.modifier = {

const Downloads = {
  ns: undefined, _p: null,
  get(){
    if (this.ns !== undefined) return Promise.resolve(this.ns);
    if (!window.claude){ this.ns = NativeDownloads; return Promise.resolve(this.ns); }
    if (!this._p) this._p = (async () => {
      try { this.ns = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; }
      catch(e){ this.ns = null; }
      return this.ns;
    })();
    return this._p;
  },
};

const toBlob = cv => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('canvas')), 'image/png'));

Object.assign(Exporter, {
  async pdf(p, set){
    const jsPDF = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDF || !window.html2canvas) throw {code:'lib'};
    set('Mise en page…');
    const host = await stageBrand(p);
    try {
      const t = Engine.tokens(p), bg = t.c.fond, docEl = host.querySelector('.bp-doc');
      const PW = 210, PH = 297, M = 12, CW = PW - M * 2, k = CW / docEl.offsetWidth, maxH = PH - M * 2 - 8;
      const left0 = docEl.getBoundingClientRect().left;
      const blocks = [[docEl.querySelector('.bp-hero'), 0]];
      docEl.querySelectorAll('.bp-sec').forEach(sec => {
        if (sec.offsetHeight * k <= maxH) blocks.push([sec, 0]);
        else [...sec.children].forEach(ch => blocks.push([ch, 5]));
      });
      const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
      const [r, g, b] = hexToRgb(bg), fg = onColor(bg) === '#FFFFFF' ? [200, 200, 200] : [110, 110, 110];
      const paint = () => { pdf.setFillColor(r, g, b); pdf.rect(0, 0, PW, PH, 'F'); };
      let page = 1, y = M; paint();
      const footer = () => { pdf.setFontSize(8); pdf.setTextColor(...fg); pdf.text(`${p.identity.name || 'Ma marque'} / Brand Page / ${page}`, M, PH - 7); };
      for (let i = 0; i < blocks.length; i++){
        const [el, gap] = blocks[i];
        set(`Mise en page ${i + 1}/${blocks.length}`);
        const cv = await html2canvas(el, {scale:2, backgroundColor:bg, logging:false, useCORS:true});
        let w = el.offsetWidth * k, h = el.offsetHeight * k;
        if (h > maxH){ const f = maxH / h; w *= f; h = maxH; }
        if (y + gap + h > PH - M - 8 && y > M){ footer(); pdf.addPage(); page++; paint(); y = M; }
        else y += (y > M ? gap : 0);
        const x = M + (el.getBoundingClientRect().left - left0) * k;
        pdf.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', x, y, w, h);
        y += h;
      }
      footer();
      return {filename:`${slug(p.identity.name)}-brand-page.pdf`, data: pdf.output('blob')};
    } finally { host.remove(); }
  },
  async zip(p, set){
    if (!window.JSZip || !window.html2canvas) throw {code:'lib'};
    set('Préparation des visuels…');
    const host = await stageBrand(p);
    try {
      const z = new JSZip(), q = s => host.querySelector(s), qa = s => [...host.querySelectorAll(s)];
      const lg = qa('.logo-grid .lg'), cards = qa('.mock-card');
      const items = [
        ['logo/logo-fond-clair.png', lg[0], 4], ['logo/logo-fond-sombre.png', lg[1], 4],
        ['logo/monogramme.png', lg[2] && lg[2].querySelector('.mono'), 8], ['logo/monogramme-inverse.png', lg[3] && lg[3].querySelector('.mono'), 8],
        ['logo/icone-app.png', lg[4] && lg[4].querySelector('.app-ic'), 10],
        ['palette.png', q('.bb-colors') || q('.bp-pal'), 3],
        ['reseaux/banniere.png', q('.m-banner'), 4], ['reseaux/post.png', q('.mock-post'), 5], ['reseaux/story.png', q('.mock-story'), 6],
        ['print/carte-recto.png', cards[0], 4], ['print/carte-verso.png', cards[1], 4], ['print/affiche.png', q('.poster'), 4], ['print/packaging.png', q('.m-pack'), 4],
        ['web/page-accueil.png', q('.m-web'), 3], ['web/signature-mail.png', q('.m-sig'), 3],
      ].filter(x => x[1]);
      for (let i = 0; i < items.length; i++){
        const [name, el, scale] = items[i];
        set(`Création des visuels ${i + 1}/${items.length}`);
        const cv = await html2canvas(el, {scale, backgroundColor:null, logging:false, useCORS:true});
        z.file(name, await toBlob(cv));
      }
      z.file('marque.json', this.json(p));
      z.file('variables.css', this.css(p));
      z.file('ADN.txt', `${adn(p)}\n\nCouleurs\n${this.hex(p)}\n`);
      set('Compression…');
      const blob = await z.generateAsync({type:'blob', compression:'DEFLATE'});
      return {filename:`${slug(p.identity.name)}-pack-visuels.zip`, data: blob};
    } finally { host.remove(); }
  },
});

const Comments = {
  pid: null, list: [], loading: false,
  async load(pid){
    this.loading = true;
    const {data, error} = await sb.from('comments').select('id,section,body,author_id,created_at,read_at,profiles(full_name,email,role)').eq('project_id', pid).order('created_at');
    this.loading = false;
    if (error){ console.error(error); return; }
    this.pid = pid; this.list = data || [];
  },
  of(pid){ return this.pid === pid ? this.list : []; },
  count(pid, sec){ return this.of(pid).filter(c => c.section === sec).length; },
  unread(pid, sec){ const me = Auth.user && Auth.user.id; return Auth.isAdmin ? this.of(pid).filter(c => (!sec || c.section === sec) && !c.read_at && c.author_id !== me).length : 0; },
  async post(pid, sec, body){
    const {error} = await sb.from('comments').insert({project_id: pid, author_id: Auth.user.id, section: sec, body: body.slice(0, 2000)});
    if (error) throw error;
    await this.load(pid);
  },
  async markRead(pid, sec){
    if (!Auth.isAdmin || !this.unread(pid, sec)) return;
    const q = sb.from('comments').update({read_at: new Date().toISOString()}).eq('project_id', pid).is('read_at', null).neq('author_id', Auth.user.id);

  },
};

/* Realtime : les nouveaux messages arrivent en direct */
let rtChannel = null;
function subscribeRealtime(){
  if (!sb) return;
  if (rtChannel){ sb.removeChannel(rtChannel); rtChannel = null; }
  if (!Auth.user) return;
  rtChannel = sb.channel('rbl-comments-' + Auth.user.id)
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'comments'}, ({new: c}) => {
      if (!Auth.user || c.author_id === Auth.user.id) return;
      toast(Auth.isAdmin ? 'Nouveau retour d’une cliente' : 'Nouveau message de Lyliie');
      App.adminData = null;
      if (App.p && c.project_id === App.p.id) Comments.load(App.p.id).then(() => { if (App.view === Screens.brand) App.refresh(); });
      else if (App.view === Screens.admin) App.refresh();
    })
    .subscribe();
}

async function onSession(session){
  const u = session && session.user || null;
  if (u && Auth.user && u.id === Auth.user.id && App.ready) return;
  Auth.user = u; Auth.profile = null; remoteIds.clear();
  Comments.pid = null; Comments.list = []; App.adminData = null; Store.others = new Map();
  if (u){
    const {data} = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
    Auth.profile = data || {id: u.id, email: u.email, role: 'client'};
    Store.adapter = RemoteAdapter;
    try { await Store.init(); } catch(e){ console.error(e); toast('Connexion à la base impossible, réessaie plus tard'); }
    try { App.localCount = localStorage.getItem('rbl.identity.imported') ? 0 : (await LocalAdapter.list()).length; } catch(e){ App.localCount = 0; }
  } else { Store.projects = []; Store.current = null; }
  subscribeRealtime();
  App.ready = true;
  const {parts} = parseRoute();
  if (u && parts[0] === 'connexion') go(''); else App.render(true);
}

    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

};

function deriveMoods(p){
  const score = {};
  (p.mood.univers || []).forEach((id, i) => (UNIVERS.find(u => u.id === id) || {moods: []}).moods.forEach((m, j) => { score[m] = (score[m] || 0) + 3 - j * .5 - i * .3; }));
  (p.mood.ambiances || []).forEach(id => (AMBIANCES.find(u => u.id === id) || {moods: []}).moods.forEach((m, j) => { score[m] = (score[m] || 0) + 1.2 - j * .3; }));
  p.mood.moods = Object.entries(score).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]);
}

Engine.defaultMode = picked => { const L = picked.map(lum); return L.some(l => l < .03) && !L.some(l => l > .8) ? 'sombre' : 'clair'; };
Engine.buildPalette = function(picked, mode){
  if (!picked || !picked.length) return null;
  const info = picked.map(h => ({h: h.toUpperCase(), l: lum(h)}));
  const lights = info.filter(x => x.l > .72), darks = info.filter(x => x.l < .035), cols = info.filter(x => x.l <= .72 && x.l >= .035);
  const ref = (cols[0] || info[0]).h, [rh, rs] = hexToHsl(ref);
  const dark = darks[0] ? darks[0].h : hslToHex(rh, Math.min(rs, 18), 7);
  const light = lights[0] ? lights[0].h : hslToHex(rh, Math.min(rs, 25), 97);
  const pool = [...cols.map(x => x.h), ...darks.slice(1).map(x => x.h), ...lights.slice(1).map(x => x.h)];
  let principale = pool[0] || (mode === 'sombre' ? light : dark);
  if (!pool.length && darks.length && lights.length) principale = mode === 'sombre' ? light : dark;
  const secondaire = pool[1] || adjust(principale, lum(principale) > .5 ? -25 : 22);
  const accent = pool[2] || hslToHex(hexToHsl(principale)[0] + 35, Math.max(hexToHsl(principale)[1], 45), 55);
  const fond = mode === 'sombre' ? dark : light, texte = mode === 'sombre' ? light : dark;
  return {fond, principale, secondaire, accent, texte};
};
Engine.sub = function(p){
  const t = p.typography, s = fontById(FONT_S, t.sous);
  if (s) return s;
  const x = fontById(FONT_X, t.texte);
  if (x) return {name: x.name, w: 600, serif: x.serif};
  const pr = this.pair(p) || FONT_PAIRS[0];
  return {name: pr.body, w: 600};
};
const _pair = Engine.pair.bind(Engine);
Engine.pair = function(p){
  const t = p.typography;
  if (t.titre){
    const T = fontById(FONT_T, t.titre) || FONT_T[0], X = fontById(FONT_X, t.texte) || FONT_X[0];
    return {id:'custom', label:T.name, display:T.name, body:X.name, w:T.w, upper:!!T.upper, serif:!!T.serif, moods:T.moods};

};

/* ---------- Thème progressif : l’app prend l’identité de la cliente ---------- */
function applyTheme(view, p){
  const root = document.documentElement.style;
  const reset = () => { ['--red','--red-rgb','--on-red','--ff-d','--red-soft'].forEach(k => root.removeProperty(k)); document.body.classList.remove('themed'); };
  if (!Auth.user || !view || ['admin','connexion','confidentialite'].includes(view.id)) return reset();
  let proj = p;
  if (!proj && ['home','projets','profil','faq'].includes(view.id)) proj = Store.sorted().find(x => x.generatedAt) || null;
  if (!proj || !proj.colors || !proj.colors.palette) return reset();
  const pal = proj.colors.palette, bg = '#050505';
  let acc = [pal.principale, pal.accent, pal.secondaire].find(h => contrast(h, bg) >= 3.2) || pal.principale;
  let guard = 0; while (contrast(acc, bg) < 3.2 && guard++ < 8) acc = adjust(acc, 8);
  const [r, g, b] = hexToRgb(acc);
  root.setProperty('--red', acc); root.setProperty('--red-rgb', `${r},${g},${b}`); root.setProperty('--on-red', onColor(acc));
  root.setProperty('--red-soft', `rgba(${r},${g},${b},.16)`);
  const T = proj.typography;
  if (T && T.titre){ const f = fontById(FONT_T, T.titre); root.setProperty('--ff-d', Engine.stack(f.name, f.serif)); } else root.removeProperty('--ff-d');
  document.body.classList.add('themed');
}

/* ---------- Export PDF v2 : mise en page Brand Board (grille façon maquette) ---------- */
async function stageBrand(p, opts = {}){
  const host = document.createElement('div');
  host.className = 'stage' + (opts.print ? ' print' : ''); host.setAttribute('aria-hidden', 'true');
  const keep = [App.sheet, App.support, App.thread]; App.sheet = false; App.support = 'tout'; App.thread = null;
  host.innerHTML = Screens.brand.html(p, new URLSearchParams(''));
  [App.sheet, App.support, App.thread] = keep;
  host.querySelectorAll('.edit, .talk, .sup-filter, .bp-toc, .bp-actions').forEach(el => el.remove());
  // html2canvas ne gère pas object-fit : on remplace les images par des fonds « cover »
  const srcs = [];
  host.querySelectorAll('.bp-doc img').forEach(im => {
    const src = im.getAttribute('src'); srcs.push(src);
    const d = document.createElement('div'); d.className = (im.className || '') + ' img-bg';
    d.style.backgroundImage = `url("${src}")`; im.replaceWith(d);
  });
  document.body.appendChild(host);
  await Promise.all([...new Set(srcs)].map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; })));
  try { await document.fonts.ready; } catch(e){}
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  fitAll(host);
  await svgToImg(host);
  return host;
}
/* Les SVG sont convertis en images avant la capture : l’outil de PDF les rend alors fidèlement */
async function svgToImg(root){
  const imgs = [];
  root.querySelectorAll('svg').forEach(sv => {
    const r = sv.getBoundingClientRect(); if (!r.width || !r.height) return;
    const cl = sv.cloneNode(true);
    cl.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    cl.setAttribute('width', Math.round(r.width)); cl.setAttribute('height', Math.round(r.height));
    cl.removeAttribute('style'); cl.removeAttribute('class');
    const str = new XMLSerializer().serializeToString(cl).replace(/currentColor/g, getComputedStyle(sv).color);
    const img = document.createElement('img');
    img.className = sv.getAttribute('class') || '';
    img.setAttribute('style', sv.getAttribute('style') || '');
    img.style.width = r.width + 'px'; img.style.height = r.height + 'px'; img.style.maxWidth = 'none';
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
    sv.replaceWith(img); imgs.push(img);
  });
  await Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
}
Exporter.pdf = async function(p, set){
  const jsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDF || !window.html2canvas) throw {code:'lib'};
  set('Mise en page…');
  const host = await stageBrand(p, {print: true});
  try {
    const docEl = host.querySelector('.bp-doc'), c = Engine.tokens(p).c;
    // Page 2 : les déclinaisons, en grille
    const p2 = document.createElement('div');
    p2.className = 'print-p2'; p2.style.cssText = docEl.getAttribute('style');
    const t = Engine.tokens(p);
    p2.innerHTML = `<h2 style="font-family:${t.fd};font-weight:${t.pair.w}">Tes déclinaisons</h2>`;
    const items = [['Logo', ['.logo-grid']], ['Bannière', ['.m-banner']], ['Post', ['.mock-post']], ['Story', ['.mock-story']], ['Carte de visite', ['.mock-card']], ['Affiche', ['.poster']], ['Packaging', ['.m-pack']], ['Page d’accueil', ['.m-web']], ['Signature mail', ['.m-sig']]];
    items.forEach(([label, sels]) => {
      const els = sels.flatMap(s => [...docEl.querySelectorAll(s)]); if (!els.length) return;
      const box = document.createElement('div'); box.className = 'p2-item' + (label === 'Story' ? ' tall' : '');
      els.forEach(el => box.appendChild(el.cloneNode(true)));
      const cap = document.createElement('p'); cap.textContent = label; box.appendChild(cap);
      p2.appendChild(box);
    });
    host.appendChild(p2);
    host.querySelectorAll('.bp-doc #bp-logo, .bp-doc #bp-supports, .bp-doc .bb-sep').forEach(el => el.remove());
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    fitAll(p2); await svgToImg(p2);

    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    const PW = 210, PH = 297, M = 8;
    const [r, g, b] = hexToRgb(c.fond);
    const footerCol = lum(c.fond) < .4 ? [200, 200, 200] : [110, 110, 110];
    const pages = [docEl, p2];
    for (let i = 0; i < pages.length; i++){
      set(`Page ${i + 1} sur ${pages.length}…`);
      if (i) pdf.addPage();
      pdf.setFillColor(r, g, b); pdf.rect(0, 0, PW, PH, 'F');
      const el = pages[i];
      const cv = await html2canvas(el, {scale: 2, backgroundColor: c.fond, logging: false, useCORS: true});
      let w = PW - M * 2, h = el.offsetHeight * w / el.offsetWidth;
      const maxH = PH - M * 2 - 6;
      if (h > maxH){ w = w * maxH / h; h = maxH; }
      pdf.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', (PW - w) / 2, M, w, h);
      pdf.setFontSize(8); pdf.setTextColor(...footerCol);
      pdf.text(`${p.identity.name || 'Ma marque'} / Brand Board / créé avec RBL Identity`, PW / 2, PH - 5, {align: 'center'});
    }
    return {filename: `${slug(p.identity.name)}-brand-board.pdf`, data: pdf.output('blob')};
  } finally { host.remove(); }
};

function fitAll(root){
  (root || document).querySelectorAll(FIT_SEL).forEach(el => {

    try { await Comments.post(App.p.id, App.thread, body); ta.value = ''; App.refresh(); const s = $('.sheet'); if (s) s.scrollTop = s.scrollHeight; }
    catch(e){ console.error(e); toast('Envoi impossible, réessaie'); btn.disabled = false; }
    finally { App.busy = false; }
  },
  async validate(){
    if (!App.confirmValidate){ App.confirmValidate = true; App.refresh(); setTimeout(() => { if (App.confirmValidate){ App.confirmValidate = false; if (App.view === Screens.brand) App.refresh(); } }, 5000); return; }
    App.confirmValidate = false;
    Store.update(p => { p.validatedAt = Date.now(); }, {silent: true}); Store.flush();
    try { await Comments.post(App.p.id, 'general', '✅ J’ai validé ma Brand Page.'); } catch(e){ console.error(e); }
    toast('Brand Page validée 👑'); App.refresh();
  },
  async sendapp(d, btn){
    const p = App.p; if (App.busy) return; App.busy = true; btn.disabled = true;
    try {
      Store.update(pp => { pp.send.sentAt = Date.now(); }, {silent: true}); Store.flush();
      const s = p.send, lines = ['📩 J’ai envoyé ma Brand Page.'];
      if (s.note.trim()) lines.push('', s.note.trim());
      if (s.rating){ lines.push('', `Mon avis sur l’app : ${'★'.repeat(s.rating)}${'☆'.repeat(5 - s.rating)}`); if (s.review.trim()) lines.push(s.review.trim()); lines.push(s.publish ? 'J’accepte que cet avis soit publié.' : 'Avis privé, merci de ne pas le publier.'); }
      await Comments.post(p.id, 'general', lines.join('\n'));
      toast('Envoyé à Lyliie 👑'); go(`p/${p.id}/brand`);
    } catch(e){ console.error(e); toast('Envoi impossible, réessaie'); }
    finally { App.busy = false; btn.disabled = false; }
  },
  async importlocal(d, btn){
    btn.disabled = true;
    try {
      const list = await LocalAdapter.list();
      for (const lp of list){ const np = migrate(clone(lp)); np.id = uid(); np.owner_id = Auth.user.id; await RemoteAdapter.save(np); Store.projects.push(np); }
      try { localStorage.setItem('rbl.identity.imported', '1'); } catch(e){}
      App.localCount = 0; toast(`${list.length} projet${list.length > 1 ? 's' : ''} ajouté${list.length > 1 ? 's' : ''} à ton compte`); App.refresh();
    } catch(e){ console.error(e); toast('Import impossible, réessaie'); btn.disabled = false; }
  },
  skipimport(){ try { localStorage.setItem('rbl.identity.imported', '1'); } catch(e){} App.localCount = 0; App.refresh(); },
  async savename(){
    const v = (($('#my-name') || {}).value || '').trim(); if (!v) return;
    const {error} = await sb.from('profiles').update({full_name: v}).eq('id', Auth.user.id);
    if (error){ console.error(error); toast('Enregistrement impossible'); return; }
    Auth.profile.full_name = v; $('#my-name').value = ''; toast(`Enchantée ${v} 👑`); App.refresh();
  },
  adminfilter(d){ App.adminFilter = d.id; App.refresh(); },
  adminreload(){ App.adminData = null; App.refresh(); },
  coachok(d){ Store.update(p => { p.coach = {...(p.coach || {}), [d.id]: true}; }); },
  sheet(){ App.thread = null; App.sheet = !App.sheet; App.sheetAnim = App.sheet; App.refresh(); App.sheetAnim = false; if (App.sheet) setTimeout(() => $('.sheet-h .btn')?.focus({preventScroll:true}), 0); },
  support(d){ App.support = d.id; App.refresh(); },
  jump(d){ const el = document.getElementById(d.id); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); },
  async dl(d, btn){
    if (App.busy) return;
    const p = App.p, st = $(`[data-status="${d.kind}"]`), label = btn.textContent;
    const set = m => { if (st) st.textContent = m; };
    App.busy = true; btn.disabled = true; btn.textContent = 'Préparation…';
    try {
      const dl = await Downloads.get();
      if (!dl){ set('Le téléchargement n’est pas disponible dans cet aperçu. Ouvre la version publiée de l’app.'); return; }
      const file = d.kind === 'json' ? {filename:`${slug(p.identity.name)}-marque.json`, data: Exporter.json(p)}
        : d.kind === 'pdf' ? await Exporter.pdf(p, set) : await Exporter.zip(p, set);
      set('Confirme le téléchargement…');
      await dl.save(file);
      set('C’est téléchargé.'); toast('Téléchargé');
    } catch(e){
      const code = e && e.code;
      set(code === 'declined' ? 'Téléchargement annulé.'
        : code === 'rate_limited' ? 'Une demande est déjà ouverte. Réessaie dans un instant.'
        : code === 'lib' ? 'Les outils d’export ne se sont pas chargés. Vérifie ta connexion puis réessaie.'
        : code === 'too_large' ? 'Fichier trop lourd pour cette destination.'
        : ['unavailable','not_granted','capability_disabled','capability_removed'].includes(code) ? 'Le téléchargement n’est pas disponible ici.'
        : 'L’export a échoué. Réessaie.');
      if (!code || code === 'bad_request') console.error(e);
    } finally { App.busy = false; btn.disabled = false; btn.textContent = label; }
  },
  rate(d){ Store.update(p => { const n = +d.id; p.send.rating = p.send.rating === n ? 0 : n; }); },
  publish(){ Store.update(p => { p.send.publish = !p.send.publish; }); },
  copysend(){ copyText(sendMessage(App.p), 'Message copié'); Store.update(p => { p.send.sentAt = Date.now(); }, {silent:true}); },
  hidecomm(){ Store.update(p => { p.send.communityHidden = true; }); },
  projsort(d){ App.projSort = d.id; App.refresh(); },
  role(d){ App.editRole = App.editRole === d.id ? null : d.id; App.refresh(); },
  setcolor(d){ App.pulse = 'pal'; Store.update(p => { p.colors.custom[d.role] = d.hex.toUpperCase(); syncPalette(p); }); },
  resetcolor(d){ App.pulse = 'pal'; Store.update(p => { delete p.colors.custom[d.role]; syncPalette(p); }); },
  upper(){ App.pulse = 'type'; Store.update(p => { p.typography.upper = !Engine.upper(p); }); },
  typoinv(){ App.typoInv = !App.typoInv; App.refresh(); },
  mood(d){ App.pulse = 'mood'; Store.update(p => toggleIn(p.mood.moods, d.id, 2)); },
  avoid(d){ Store.update(p => toggleIn(p.mood.avoid, d.id, AVOID.length)); },
  pair(d){ App.pulse = 'type'; Store.update(p => { p.typography.pairId = d.id; }); },
  visual(d){ App.pulse = 'vis'; Store.update(p => toggleIn(p.visual[d.group], d.id, VISUALS[d.group].max)); },
  trait(d){ Store.update(p => toggleIn(p.identity.personality, d.id, 4)); },
  copy(d){ copyText(d.text, `${d.text} copié`); },
  export(d){ const p = App.p; copyText(d.kind === 'json' ? Exporter.json(p) : d.kind === 'css' ? Exporter.css(p) : Exporter.hex(p)); },
  async dup(d){ const p = await Store.duplicate(d.id); if (!p) return; toast('Variante créée'); go(`p/${p.id}/modifier`); },
  async del(d){
    if (App.pendingDel === d.id){ App.pendingDel = null; try { await Store.remove(d.id); toast('Projet supprimé'); } catch(e){ console.error(e); toast('Suppression impossible'); } App.refresh(); return; }
    App.pendingDel = d.id; App.refresh();
    clearTimeout(Actions._delT); Actions._delT = setTimeout(() => { if (App.pendingDel === d.id){ App.pendingDel = null; if (App.view === Screens.projets) App.refresh(); } }, 4000);
  },
};

/* Actions du lot 2 */
Object.assign(Actions, {
  tab(d){ App[d.group] = d.id; App.editRole = null; App.refresh(); const t = $('.tabs2'); if (t && t.getBoundingClientRect().top < 60) t.scrollIntoView({block: 'start'}); },
  pickcolor(d){
    App.pulse = 'pal'; App.editRole = null;
    Store.update(p => {
      const C = p.colors; C.picked = C.picked || [];
      if (toggleIn(C.picked, d.hex, 5)){ C.custom = {}; if (!C.picked.length) C.mode = null; else if (!C.mode) C.mode = Engine.defaultMode(C.picked); syncPalette(p); }
    });
  },
  colmode(d){ App.pulse = 'pal'; Store.update(p => { p.colors.mode = d.id; p.colors.custom = {}; syncPalette(p); }); },
  moodpick(d){ App.pulse = 'mood'; Store.update(p => { p.mood[d.group] = p.mood[d.group] || []; toggleIn(p.mood[d.group], d.id, 2); deriveMoods(p); }); },
  fontpick(d){ App.pulse = 'type'; Store.update(p => { const T = p.typography; T[d.slot] = T[d.slot] === d.id && d.slot === 'sous' ? null : d.id; }); },
  element(d){ Store.update(p => { p.identity.elements = p.identity.elements || []; toggleIn(p.identity.elements, d.id, 3); }); },
  logostyle(d){ Store.update(p => { p.identity.logoStyle = p.identity.logoStyle === d.id ? null : d.id; }); },
  target(d){ Store.update(p => { p.identity.targets = p.identity.targets || []; toggleIn(p.identity.targets, d.id, 2); }); },
  power(d){ Store.update(p => { p.identity.powers = p.identity.powers || []; toggleIn(p.identity.powers, d.id, 3); }); },
  value(d){ Store.update(p => { p.identity.values = p.identity.values || []; toggleIn(p.identity.values, d.id, 3); }); },
  trait(d){ Store.update(p => toggleIn(p.identity.personality, d.id, 3)); },
  visual(d){
    App.pulse = 'vis';
    Store.update(p => {
      const max = VISUALS[d.group].max; p.visual[d.group] = p.visual[d.group] || [];
      if (max === 1) p.visual[d.group] = p.visual[d.group][0] === d.id ? [] : [d.id];
      else toggleIn(p.visual[d.group], d.id, max);
    });
  },
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-addcolor]'); if (!t || !App.p) return;
  const h = t.value.toUpperCase();
  App.pulse = 'pal';
  Store.update(p => {
    const C = p.colors; C.extra = C.extra || []; C.picked = C.picked || [];
    if (!C.extra.includes(h)) C.extra.push(h);
    if (!C.picked.includes(h)){ if (C.picked.length >= 5){ toast('5 couleurs maximum : retire-en une d’abord'); return; } C.picked.push(h); }
    C.custom = {}; if (!C.mode) C.mode = Engine.defaultMode(C.picked); syncPalette(p);
  });
});

document.addEventListener('click', e => {
  const sent = e.target.closest('[data-sent]');
  if (sent){ Store.update(p => { p.send.sentAt = Date.now(); }, {silent:true}); toast('Ton message s’ouvre : pense à joindre le PDF'); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = Actions[t.dataset.act];
  if (fn){
    e.preventDefault();
    if (t.hasAttribute('aria-pressed') || t.dataset.act === 'setcolor'){ try { navigator.vibrate && navigator.vibrate(8); } catch(_){} }
    fn({...t.dataset}, t);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'admin-search'){ App.adminQuery = e.target.value; App.refresh(); return; }
  if (e.target.matches && e.target.matches('[data-proj-search]')){ App.projQuery = e.target.value; const l = $('#proj-list'); if (l) l.innerHTML = projList(); return; }
  const t = e.target.closest('[data-input]'); if (!t) return;
  const [sec, key] = t.dataset.input.split('.');
  Store.update(p => { p[sec][key] = t.value; }, {silent: true});
  if (t.dataset.live){ const el = document.getElementById(t.dataset.live); if (el) el.textContent = t.value.trim() || t.dataset.ph; }
  if (sec === 'typography') $$('.spec-d').forEach(el => { el.textContent = t.value || 'Ma marque'; });
  if (sec === 'send') updateSendLinks();
  if (sec === 'identity') $$(`[data-bind="${key}"]`).forEach(el => { el.textContent = t.value.trim() || el.dataset.fb; });
  if (sec === 'identity' && key === 'name'){
    App.renderBar();
    const u = $('.u-name'); if (u){ u.textContent = t.value.trim() || 'Ta marque'; }
  }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-color]'); if (!t) return;
  App.pulse = 'pal';
  Store.update(p => { p.colors.custom[t.dataset.color] = t.value.toUpperCase(); syncPalette(p); });
});
window.addEventListener('hashchange', () => { if (App.ready) App.render(true); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && App.sheet) Actions.sheet(); });

let sessionChain = Promise.resolve();
const queueSession = s => { sessionChain = sessionChain.then(() => onSession(s)).catch(e => console.error(e)); return sessionChain; };
(async () => {
  if (!sb){ $('#main').innerHTML = '<section class="screen"><h1>Oups</h1><p class="lead">L’application n’a pas pu se charger. Vérifie ta connexion puis recharge la page.</p></section>'; return; }
  App.render(true);
  const hash = location.hash;
  const {data} = await sb.auth.getSession();
  if (/access_token=|error_description=|[#&]error=/.test(hash)){
    history.replaceState(null, '', location.pathname + location.search + '#/');
    if (/error/.test(hash)) setTimeout(() => toast('Ce lien a expiré ou a déjà servi. Redemande un lien.'), 300);
  }
  await queueSession(data && data.session);
  sb.auth.onAuthStateChange((ev, s) => { setTimeout(() => queueSession(s), 0); });
  Downloads.get();
})();
</script>
</body>
